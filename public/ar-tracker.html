<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QR Code AR Tracker</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #000;
    }
    .glass-panel {
      position: absolute;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #ui-layer {
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .back-btn {
      top: 20px;
      left: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #D4AF37;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }
  </style>
</head>
<body style="margin : 0px; overflow: hidden;">
  
  <a href="/" class="glass-panel back-btn">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    Exit AR
  </a>

  <div id="ui-layer" class="glass-panel">
    <div class="pulse-dot"></div>
    Point at AR Marker
  </div>

  <!-- AR.js Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="antialias: true; alpha: true"
  >
    <!-- We use the default "Hiro" marker for AR.js -->
    <a-marker preset="hiro">
      <!-- The 3D model will be injected here -->
      <a-entity
        id="ar-model"
        position="0 0 0"
        scale="1 1 1"
        rotation="-90 0 0"
      ></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Extract the model URL from the query string
    const urlParams = new URLSearchParams(window.location.search);
    const modelUrl = urlParams.get('model');
    const scaleParam = urlParams.get('scale') || "0.05"; // Default scale

    if (modelUrl) {
      const modelEntity = document.getElementById('ar-model');
      // Set the glTF model
      modelEntity.setAttribute('gltf-model', modelUrl);
      // Adjust scale to fit on the marker
      modelEntity.setAttribute('scale', `${scaleParam} ${scaleParam} ${scaleParam}`);
    } else {
      document.getElementById('ui-layer').innerHTML += "<br><span style='color:red;'>No model provided in URL.</span>";
    }
  </script>
</body>
</html>
