<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR Viewer</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #0B0B0B; }
    .glass-panel {
      position: absolute;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      top: 20px;
      left: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }
    #ui-layer {
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
  <script>
    // A-Frame component to automatically scale and center ANY 3D model
    AFRAME.registerComponent('auto-scale-center', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          
          // Calculate bounding box
          const box = new THREE.Box3().setFromObject(obj);
          const size = box.getSize(new THREE.Vector3());
          
          // Find the largest dimension
          const maxDim = Math.max(size.x, size.y, size.z);
          
          // We want the model to be exactly 2 meters wide/tall in VR
          // so it sits perfectly in front of the user without clipping
          const targetSize = 2; 
          const scale = targetSize / maxDim;
          this.el.setAttribute('scale', `${scale} ${scale} ${scale}`);
          
          // Center the model mesh so it pivots properly
          const center = box.getCenter(new THREE.Vector3());
          obj.position.set(-center.x, -center.y, -center.z);
        });
      }
    });
  </script>
</head>
<body>

  <a href="/" class="glass-panel back-btn">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    Exit VR
  </a>

  <!-- A-Frame automatically adds a VR Enter button in the bottom right -->
  <a-scene background="color: #0B0B0B">
    <a-assets id="assets"></a-assets>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #fff; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.5" position="-0.5 1 1"></a-entity>

    <!-- Model Container - Placed 3 meters in front, 1 meter high -->
    <a-entity position="0 1 -3" animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
      <a-entity
        id="vr-model"
        auto-scale-center
      ></a-entity>
    </a-entity>

    <!-- Camera and Cursor -->
    <a-entity camera look-controls wasd-controls position="0 1.6 0">
      <a-entity cursor="fuse: true; fuseTimeout: 500"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: #D4AF37; shader: flat">
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const modelUrl = urlParams.get('model');

    if (modelUrl) {
      const modelEntity = document.getElementById('vr-model');
      modelEntity.setAttribute('gltf-model', modelUrl);
    }
  </script>
</body>
</html>
